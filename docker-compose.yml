services:
  mediasearch:
    build: .
    ports:
      - "127.0.0.1:8080:8000"   # only reachable from this machine; expose it through your tunnel
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in a .env file next to this compose file}
    volumes:
      - mediasearch-data:/data  # Docker-managed volume: keeps settings across restarts and updates
      # Same paths on the host and in the container, so they match what Transmission uses.
      - /media/downloads:/media/downloads   # Transmission's incomplete/ and complete/ folders
      - /media/audiobooks:/media/audiobooks
      - /media/ebooks:/media/ebooks
    restart: unless-stopped

volumes:
  mediasearch-data:
