<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mediasearch</title>
<style>
  :root {
    --bg: #0c1120;
    --card: #161d30;
    --line: #26304a;
    --text: #e6e9f2;
    --muted: #8c96b0;
    --accent: #4f7cff;
    --accent-hover: #6b91ff;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    /* Landscape on every page. Scroll (not fixed) so it works on iPhone Safari. */
    background: var(--bg) url("/static/background.svg") 50% 100% / cover no-repeat;
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 1rem 3rem; }
  /* Pages with forms or long text get a dark panel so the labels stay readable over the artwork. */
  .panel .wrap {
    background: rgba(12, 17, 32, .82); border-radius: 18px;
    margin: 1rem auto; padding: 0 1.25rem 2rem; max-width: 900px;
  }
  nav { display: flex; flex-wrap: wrap; gap: .4rem; padding: 1.25rem 0; justify-content: center; }
  nav a {
    color: var(--muted); text-decoration: none; padding: .45rem 1rem;
    border-radius: 999px; font-weight: 500; white-space: nowrap;
  }
  @media (max-width: 600px) {
    nav a { padding: .4rem .7rem; font-size: .92rem; }
  }
  nav a:hover, nav a.active { color: var(--text); background: var(--card); }

  input[type=text], input[type=search], input[type=password], input[type=url] {
    background: var(--card); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: .55rem .8rem; font-size: 1rem; outline: none;
    max-width: 100%; min-width: 0;
  }
  /* Fields in a row share the width and shrink to fit the screen, never wider than it. */
  .row input[type=text], .row input[type=url], .row input[type=password] {
    flex: 1 1 180px; width: auto;
  }
  .row label { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: .3rem; }
  .row label input[type], label.row input[type] { width: 100%; flex: none; }
  .row button { flex: 0 0 auto; }
  img, svg { max-width: 100%; height: auto; }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: .55rem 1rem; font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  button.ghost:hover { background: var(--line); }

  .msg, .err { padding: .7rem 1rem; border-radius: 10px; margin: 1rem 0; }
  .msg { background: #15301f; color: #9fe3b5; }
  .err { background: #3a1820; color: #ffb4bf; }
  .row { margin: .5rem 0; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .row label { color: var(--muted); }
  h2, h3 { font-weight: 600; }
  h2 { margin-top: 0; }
</style>
{% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
<div class="wrap">
  {% if user %}
  <nav>
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Search</a>
    <a href="/downloads" class="{{ 'active' if request.url.path == '/downloads' else '' }}">Downloads</a>
    {% if user.admin %}
    <a href="/config" class="{{ 'active' if request.url.path == '/config' else '' }}">Config</a>
    <a href="/users" class="{{ 'active' if request.url.path == '/users' else '' }}">Users</a>
    {% endif %}
    <a href="/account" class="{{ 'active' if request.url.path == '/account' else '' }}">{{ user.username }}</a>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
