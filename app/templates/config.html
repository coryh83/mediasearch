{% extends "base.html" %}
{% block content %}
<h2>Config</h2>
{% if saved %}<p class="msg">Saved.</p>{% endif %}

<form method="post" action="/config">
  <h3>Indexers</h3>
  <p>Paste each Jackett indexer's Torznab feed URL (Jackett: indexer, "Copy Torznab Feed"). Leave blank rows empty.</p>
  {% for row in rows %}
  <div class="row">
    <input type="text" name="names" placeholder="Name" value="{{ row.name }}" size="20">
    <input type="url" name="urls" placeholder="http://jackett:9117/api/v2.0/indexers/NAME/results/torznab/?apikey=KEY" value="{{ row.url }}" size="80">
  </div>
  {% endfor %}

  <h3>Download client: Transmission</h3>
  <div class="row"><label>URL <input type="url" name="transmission_url" value="{{ cfg.transmission.url }}" size="50"></label></div>
  <div class="row"><label>Username <input type="text" name="transmission_username" value="{{ cfg.transmission.username }}"></label></div>
  <div class="row"><label>Password <input type="password" name="transmission_password" value="" placeholder="{% if has_password %}saved — leave blank to keep{% endif %}"></label></div>

  <p><button type="submit">Save</button></p>
</form>
{% endblock %}
