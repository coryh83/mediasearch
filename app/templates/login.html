{% extends "base.html" %}
{% block content %}
<div style="max-width:380px; margin: 4rem auto 0; background: rgba(12,17,32,.85); border-radius:18px; padding: 1.75rem">
  <h2 style="margin-bottom:1rem">Sign in</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login" style="display:flex; flex-direction:column; gap:.75rem">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="row" style="flex-direction:column; align-items:stretch">Username
      <input type="text" name="username" autocomplete="username" autofocus required>
    </label>
    <label class="row" style="flex-direction:column; align-items:stretch">Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" style="margin-top:.5rem">Sign in</button>
  </form>
</div>
{% endblock %}
